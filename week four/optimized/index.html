<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lightweight task manager for planning focused work.">
  <meta name="theme-color" content="#f4f7fb">
  <title>TaskFlow | Lightweight Task Manager</title>
  <link rel="stylesheet" href="styles.min.css">
  <script src="script.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="topbar">
    <a class="brand" href="#" aria-label="TaskFlow home">TaskFlow</a>
    <span>Small steps. Real progress.</span>
  </header>
  <main class="container" id="main">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">YOUR WORKSPACE</p>
      <h1 id="page-title">Make room for what matters.</h1>
      <p>Capture a task, choose a priority, and keep moving.</p>
    </section>
    <section class="panel" aria-label="Task manager">
      <form id="task-form">
        <label for="task-input">New task</label>
        <p class="hint" id="task-hint">Keep it short and specific.</p>
        <div class="form-row">
          <input id="task-input" name="task" placeholder="e.g. Finish project report" aria-describedby="task-hint task-error" maxlength="120" required>
          <select id="priority" aria-label="Task priority"><option value="Normal">Normal priority</option><option value="High">High priority</option><option value="Low">Low priority</option></select>
          <button type="submit">Add task</button>
        </div>
        <p id="task-error" class="error" role="alert" hidden></p>
      </form>
      <div class="toolbar">
        <label class="sr-only" for="search">Search tasks</label>
        <input id="search" type="search" placeholder="Search tasks" autocomplete="off">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="done" aria-pressed="false">Completed</button>
        </div>
      </div>
      <p id="summary" class="summary" aria-live="polite">0 tasks · 0 completed</p>
      <ul id="tasks" class="tasks" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add your first task above.</p>
    </section>
  </main>
  <footer>TaskFlow · Plan gently, finish strongly.</footer>
</body>
</html>
